name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-secret-at-least-16-chars!!
  DATABASE_URL: file:./prisma/test.db
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: Lint · typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests (coverage gates)
        run: npm run test:coverage
      - name: Company script
        run: npm run company

  docker:
    name: Production image (build only)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image — do not start a container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: |
            dont-wishlist:ci
            dont-wishlist:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  ship-gate:
    name: Ship gate
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 5
    steps:
      - name: Promote only after green quality + image
        run: |
          echo "quality=pass"
          echo "docker-image=built"
          echo "container-started=false"
          echo "ready-to-promote=true"
